[project]
name = "salary-mcp-agent"
version = "0.1.0"
description = "MCP server over Taiwan listed-company salary disclosures, and a Claude Agent SDK agent that researches through it"
requires-python = ">=3.11"
dependencies = ["mcp>=1.29", "claude-agent-sdk>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
salary-mcp = "salary_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["salary_mcp", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
